[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utah-housing-anomaly-detection"
version = "0.1.0"
description = "Detect Utah housing listing price anomalies with regression."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium",
    "matplotlib",
    "databricks-sdk>=0.29.0",
    "numpy",
    "pandas",
    "requests",
    "scikit-learn",
]

[project.scripts]
utah-housing-anomaly = "pipeline:main"
utah-housing-databricks-job = "databricks_job:main"

[tool.setuptools]
py-modules = [
    "build_figures",
    "databricks_job",
    "data_prep",
    "logging_utils",
    "model",
    "pipeline",
    "zillow_extract",
]
